name: Daily manga worker
on:
  schedule:
    - cron: '47 4 * * *'
    - cron: '47 10 * * *'
    - cron: '47 16 * * *'
  workflow_dispatch:
    inputs:
      manga_url:
        description: 'Optional WeebCentral series link; leave empty to continue saved jobs'
        required: false
        type: string
      dry_run:
        description: 'Check configuration only; no downloads, GPU or model requests'
        default: true
        type: boolean
      retry_manga_id:
        description: 'Saved manga ID to resume after a configuration fix/review; quota counts stay intact'
        required: false
        type: string
      phase:
        description: 'Stage to run'
        type: choice
        default: all
        options: [all, download, prepare]
      colab_profile:
        description: 'Authorized Colab profile for this run'
        type: choice
        default: primary
        options: [primary, alternate-1, alternate-2, alternate-3]
concurrency:
  group: manga-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  worker:
    name: ${{ inputs.phase || (github.event.schedule == '47 4 * * *' && 'prepare') || (github.event.schedule == '47 16 * * *' && 'download') || 'all' }}
    if: github.repository == 'Wabsa-kh/manga-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      MANGA_STORE_REMOTE: ${{ vars.MANGA_STORE_REMOTE }}
      MANGA_URL: ${{ inputs.manga_url }}
      MANGA_RETRY_ID: ${{ inputs.retry_manga_id }}
      MANGA_PHASE: ${{ inputs.phase || (github.event.schedule == '47 4 * * *' && 'prepare') || (github.event.schedule == '47 16 * * *' && 'download') || 'all' }}
      DRY_RUN: ${{ inputs.dry_run }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: manga_bot/requirements.txt
      - name: Install CPU worker and Colab client
        timeout-minutes: 15
        run: |
          sudo sed -i -E 's#https?://[A-Za-z0-9.-]*archive.ubuntu.com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/ubuntu.sources
          python scripts/install_media.py ffmpeg rclone
          python -m pip install --disable-pip-version-check --timeout 30 --retries 2 -r manga_bot/requirements.txt
          if [ "$MANGA_PHASE" != prepare ]; then
            python -m pip install --disable-pip-version-check --timeout 30 --retries 2 google-colab-cli==0.8.0
            timeout 30s colab exec --help
          fi
          python scripts/check_config.py
      - name: Check configuration and process bounded work
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_CREDENTIALS_JSON: ${{ secrets.MODEL_CREDENTIALS_JSON }}
          MANGA_RCLONE_CONFIG: ${{ secrets.MANGA_RCLONE_CONFIG }}
          COLAB_PROFILE: ${{ inputs.colab_profile || 'primary' }}
          COLAB_ADC_JSON: ${{ inputs.colab_profile == 'alternate-1' && secrets.COLAB_ADC_ALT_1_JSON || inputs.colab_profile == 'alternate-2' && secrets.COLAB_ADC_ALT_2_JSON || inputs.colab_profile == 'alternate-3' && secrets.COLAB_ADC_ALT_3_JSON || ((inputs.colab_profile == 'primary' || !inputs.colab_profile) && secrets.COLAB_ADC_JSON) || '' }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python scripts/github_worker.py
      - name: Release managed Colab sessions after success or cancellation
        if: always() && env.MANGA_PHASE != 'prepare'
        timeout-minutes: 5
        env:
          COLAB_PROFILE: ${{ inputs.colab_profile || 'primary' }}
          COLAB_ADC_JSON: ${{ inputs.colab_profile == 'alternate-1' && secrets.COLAB_ADC_ALT_1_JSON || inputs.colab_profile == 'alternate-2' && secrets.COLAB_ADC_ALT_2_JSON || inputs.colab_profile == 'alternate-3' && secrets.COLAB_ADC_ALT_3_JSON || ((inputs.colab_profile == 'primary' || !inputs.colab_profile) && secrets.COLAB_ADC_JSON) || '' }}
        run: python scripts/cleanup_colab.py
      - name: Keep public-safe connection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_id }}
          path: worker-report.json
          if-no-files-found: ignore
          retention-days: 14
