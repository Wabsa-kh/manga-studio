name: Daily manga worker
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      manga_url:
        description: 'Optional WeebCentral series link; leave empty to continue saved jobs'
        required: false
        type: string
      dry_run:
        description: 'Check configuration only; no downloads, GPU or model requests'
        default: true
        type: boolean
      retry_manga_id:
        description: 'Saved manga ID to resume after a configuration fix/review; quota counts stay intact'
        required: false
        type: string
concurrency:
  group: manga-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  worker:
    if: github.repository == 'Wabsa-kh/manga-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MANGA_RCLONE_CONFIG: ${{ secrets.MANGA_RCLONE_CONFIG }}
      MANGA_STORE_REMOTE: ${{ vars.MANGA_STORE_REMOTE }}
      COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      MANGA_URL: ${{ inputs.manga_url }}
      MANGA_RETRY_ID: ${{ inputs.retry_manga_id }}
      DRY_RUN: ${{ inputs.dry_run }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: manga_bot/requirements.txt
      - name: Install CPU worker and Colab client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          python -m pip install -r manga_bot/requirements.txt google-colab-cli
          colab exec --help
      - name: Check configuration and process bounded work
        run: python scripts/github_worker.py
      - name: Keep public-safe connection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_id }}
          path: worker-report.json
          if-no-files-found: ignore
          retention-days: 14
