name: Daily manga worker
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      manga_url:
        description: 'Optional WeebCentral series link; leave empty to continue saved jobs'
        required: false
        type: string
      dry_run:
        description: 'Check configuration only; no downloads, GPU or model requests'
        default: true
        type: boolean
      retry_manga_id:
        description: 'Saved manga ID to resume after a configuration fix/review; quota counts stay intact'
        required: false
        type: string
concurrency:
  group: manga-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  worker:
    if: github.repository == 'Wabsa-kh/manga-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      MANGA_STORE_REMOTE: ${{ vars.MANGA_STORE_REMOTE }}
      MANGA_URL: ${{ inputs.manga_url }}
      MANGA_RETRY_ID: ${{ inputs.retry_manga_id }}
      DRY_RUN: ${{ inputs.dry_run }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: manga_bot/requirements.txt
      - name: Install CPU worker and Colab client
        timeout-minutes: 15
        run: |
          sudo sed -i -E 's#https?://[A-Za-z0-9.-]*archive.ubuntu.com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/ubuntu.sources
          python scripts/install_media.py ffmpeg rclone
          python -m pip install --disable-pip-version-check --timeout 30 --retries 2 -r manga_bot/requirements.txt google-colab-cli
          timeout 30s colab exec --help
          python scripts/check_config.py
      - name: Check configuration and process bounded work
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_CREDENTIALS_JSON: ${{ secrets.MODEL_CREDENTIALS_JSON }}
          MANGA_RCLONE_CONFIG: ${{ secrets.MANGA_RCLONE_CONFIG }}
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python scripts/github_worker.py
      - name: Keep public-safe connection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_id }}
          path: worker-report.json
          if-no-files-found: ignore
          retention-days: 14
