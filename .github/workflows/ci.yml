name: Pipeline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: manga_bot/requirements.txt
      - name: Install media runtime
        timeout-minutes: 15
        run: |
          sudo sed -i -E 's#https?://[A-Za-z0-9.-]*archive.ubuntu.com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/ubuntu.sources
          python scripts/install_media.py ffmpeg
          python -m pip install --disable-pip-version-check --timeout 30 --retries 2 -r manga_bot/requirements.txt
      - name: Compile and scan source
        run: |
          python -m compileall -q manga_bot scripts
          python scripts/check_secrets.py
      - name: Failure, persistence and real render tests
        run: python -m unittest test_manga_bot test_visual_v11 test_studio test_publishing -v

