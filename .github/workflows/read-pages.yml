name: Read saved manga pages
on:
#  schedule:
  #  - cron: '47 22 * * *'
  workflow_dispatch:
concurrency:
  group: manga-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  reader:
    if: github.repository == 'Wabsa-kh/manga-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      MANGA_STORE_REMOTE: ${{ vars.MANGA_STORE_REMOTE }}
      MANGA_READ_ONLY: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: manga_bot/requirements.txt
      - name: Install reader and Drive client
        timeout-minutes: 15
        run: |
          python scripts/install_media.py rclone
          python -m pip install --disable-pip-version-check --timeout 30 --retries 2 -r manga_bot/requirements.txt
          python scripts/check_config.py
      - name: Read originals from Drive
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_CREDENTIALS_JSON: ${{ secrets.MODEL_CREDENTIALS_JSON }}
          MANGA_RCLONE_CONFIG: ${{ secrets.MANGA_RCLONE_CONFIG }}
        run: python scripts/github_worker.py
